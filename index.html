<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>高精度相机光学模拟器 (全动态版)</title>
    <style>
        :root {
            --bg-color: #0f111a;
            --panel-bg: rgba(15, 17, 26, 0.85);
            --border-color: #2a2d3d;
            --accent-color: #0ea5e9;
            --text-main: #f8fafc;
            --text-secondary: #94a3b8;
            --highlight: #38bdf8;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            background-image: radial-gradient(circle at 50% 50%, #1e293b 0%, #0f111a 100%);
        }

        #canvas-container { width: 100%; height: 100%; display: block; }

        #control-panel {
            position: absolute;
            top: 20px; left: 20px;
            width: 320px;
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            backdrop-filter: blur(16px);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.9);
            z-index: 10;
            max-height: calc(100vh - 40px);
            overflow-y: auto;
        }

        #control-panel::-webkit-scrollbar { width: 4px; }
        #control-panel::-webkit-scrollbar-thumb { background: #334155; border-radius: 2px; }

        h1 {
            font-size: 15px; font-weight: 600;
            margin-bottom: 16px; color: var(--text-main);
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 12px;
        }

        .control-group { margin-bottom: 12px; }
        .divider { height: 1px; background: var(--border-color); margin: 16px 0; }

        label {
            display: flex; justify-content: space-between;
            font-size: 12px; color: var(--text-secondary); margin-bottom: 6px;
        }
        label span { color: var(--highlight); font-weight: 600; font-family: monospace; font-size: 13px; }

        input[type="range"] {
            width: 100%; height: 4px; background: #334155;
            border-radius: 2px; outline: none; -webkit-appearance: none;
            transition: background 0.2s;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none; width: 12px; height: 12px;
            border-radius: 50%; background: var(--accent-color);
            cursor: pointer; box-shadow: 0 0 10px var(--accent-color);
            transition: transform 0.1s;
        }
        
        input[type="range"]::-webkit-slider-thumb:hover { transform: scale(1.3); }
        .slider-cam::-webkit-slider-thumb { background: #06b6d4; box-shadow: 0 0 10px #06b6d4; }
        .slider-fov::-webkit-slider-thumb { background: #8b5cf6; box-shadow: 0 0 10px #8b5cf6; }
        .slider-obj::-webkit-slider-thumb { background: #f59e0b; box-shadow: 0 0 10px #f59e0b; }
        .slider-carpet::-webkit-slider-thumb { background: #3b82f6; box-shadow: 0 0 10px #3b82f6; }

        #info-tip {
            position: absolute; bottom: 20px; left: 20px;
            background: var(--panel-bg); border: 1px solid var(--border-color);
            padding: 10px 16px; border-radius: 8px;
            font-size: 12px; color: var(--text-secondary);
            backdrop-filter: blur(8px); pointer-events: none; z-index: 10;
        }
    </style>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <div id="control-panel">
        <h1>📸 纯粹几何光学棱锥仿真</h1>
        
        <div class="control-group">
            <label>房间深度 (D): <span id="val-depth">8.0</span> m</label>
            <input type="range" id="range-depth" min="5" max="15" step="0.5" value="8.0">
        </div>
        <div class="control-group">
            <label>房间宽度 (W): <span id="val-width">5.0</span> m</label>
            <input type="range" id="range-width" min="3" max="15" step="0.5" value="5.0">
        </div>
        <div class="control-group">
            <label>房间高度 (H): <span id="val-height">2.9</span> m</label>
            <input type="range" id="range-height" min="2.2" max="5.0" step="0.1" value="2.9">
        </div>
        
        <div class="divider"></div>

        <div class="control-group">
            <label>相机深度 (Cam Z): <span id="val-camz" style="color:#06b6d4;">7.0</span> m</label>
            <input type="range" class="slider-cam" id="range-camz" min="0" max="15" step="0.1" value="7.0">
        </div>
        <div class="control-group">
            <label>相机高度 (Cam H): <span id="val-camh" style="color:#06b6d4;">2.6</span> m</label>
            <input type="range" class="slider-cam" id="range-camh" min="1.0" max="4.0" step="0.1" value="2.6">
        </div>
        <div class="control-group">
            <label>目标点-俯仰角 (Target Z): <span id="val-targetZ" style="color:#06b6d4;">2.2</span> m</label>
            <input type="range" class="slider-cam" id="range-targetZ" min="-10" max="15" step="0.1" value="2.2">
        </div>
        
        <div class="divider"></div>

        <div class="control-group">
            <label>水平视场角 (HFOV): <span id="val-hfov" style="color:#8b5cf6;">83</span> °</label>
            <input type="range" class="slider-fov" id="range-hfov" min="30" max="140" step="1" value="83">
        </div>
        <div class="control-group">
            <label>光锥投射距离 (Far Plane): <span id="val-fardist" style="color:#8b5cf6;">7.0</span> m</label>
            <input type="range" class="slider-fov" id="range-fardist" min="5" max="30" step="0.1" value="7.0">
        </div>

        <div class="divider"></div>

        <div class="control-group">
            <label>地毯起点深度 (Carpet Z): <span id="val-carpetz" style="color:#3b82f6;">1.00</span> m</label>
            <input type="range" class="slider-carpet" id="range-carpetz" min="0.0" max="10.0" step="0.05" value="1.0">
        </div>
        <div class="control-group">
            <label>栏杆深度位置 (Rail Z): <span id="val-railz" style="color:#f59e0b;">6.00</span> m</label>
            <input type="range" class="slider-obj" id="range-railz" min="0.0" max="15.0" step="0.05" value="6.0">
        </div>
        <div class="control-group">
            <label>栏杆高度 (Rail H): <span id="val-railh" style="color:#f59e0b;">1.0</span> m</label>
            <input type="range" class="slider-obj" id="range-railh" min="0.0" max="2.5" step="0.1" value="1.0">
        </div>
    </div>

    <div id="info-tip">
        <b>💡 场景测试：</b>地毯与栏杆均可前后移动，1.9m人像将自动跟随地毯。
    </div>

    <div id="canvas-container"></div>

    <script>
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();

        const mainCamera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
        mainCamera.position.set(14, 8, 15);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setClearColor(0x000000, 0); 
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(mainCamera, renderer.domElement);
        controls.enableDamping = true;
        controls.target.set(0, 1.5, 3.5);

        scene.add(new THREE.AmbientLight(0xffffff, 0.5));
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.7);
        dirLight.position.set(5, 12, 8);
        scene.add(dirLight);

        const roomGroup = new THREE.Group();
        scene.add(roomGroup);

        // 已更新最新默认参数
        const params = { 
            depth: 8.0, width: 5.0, height: 2.9, 
            camZ: 7.0, camH: 2.6, targetZ: 2.2, 
            hfov: 83, farDist: 7.0, 
            railH: 1.0, railZ: 6.0,
            carpetZ: 1.0  
        };

        function createCameraModel() {
            const group = new THREE.Group();
            const bodyMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, metalness: 0.8 });
            group.add(new THREE.Mesh(new THREE.BoxGeometry(0.25, 0.15, 0.35), bodyMat));
            
            const lensMat = new THREE.MeshStandardMaterial({ color: 0x0f172a, metalness: 0.9 });
            const lens = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, 0.15, 24), lensMat);
            lens.rotation.x = Math.PI / 2;
            lens.position.z = -0.22;
            group.add(lens);
            return group;
        }

        function createHumanModel(x, z) {
            const group = new THREE.Group();
            const mat = new THREE.MeshStandardMaterial({ color: 0xeab308, transparent: true, opacity: 0.85 }); 
            const body = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.2, 1.5, 16), mat);
            body.position.y = 0.75;
            group.add(body);
            const head = new THREE.Mesh(new THREE.SphereGeometry(0.2, 16, 16), mat);
            head.position.y = 1.7;
            group.add(head);
            group.position.set(x, 0, z);
            return group;
        }

        function updateScene() {
            roomGroup.clear();
            const { depth: D, width: W, height: H, camZ, camH, targetZ, hfov, farDist, railH, railZ, carpetZ } = params;

            // 1. 房间线框与地面网格
            const roomGeo = new THREE.BoxGeometry(W, H, D);
            const wireframe = new THREE.LineSegments(
                new THREE.EdgesGeometry(roomGeo), 
                new THREE.LineBasicMaterial({ color: 0x475569 })
            );
            wireframe.position.set(0, H / 2, D / 2);
            roomGroup.add(wireframe);

            const grid = new THREE.GridHelper(Math.max(W, D)*1.5, 20, 0x475569, 0x1e293b);
            grid.position.set(0, 0, D / 2);
            grid.material.transparent = true;
            grid.material.opacity = 0.5;
            roomGroup.add(grid);

            // 2. 地毯
            const carpet = new THREE.Mesh(
                new THREE.PlaneGeometry(4, 4),
                new THREE.MeshStandardMaterial({ color: 0x1d4ed8, side: THREE.DoubleSide, transparent: true, opacity: 0.8 })
            );
            carpet.rotation.x = -Math.PI / 2;
            carpet.position.set(0, 0.005, carpetZ + 2.0); 
            roomGroup.add(carpet);

            // 3. 人像跟随地毯
            roomGroup.add(createHumanModel(-1.8, carpetZ + 0.2)); 
            roomGroup.add(createHumanModel(1.8, carpetZ + 0.2));  
            roomGroup.add(createHumanModel(-1.8, carpetZ + 3.8)); 
            roomGroup.add(createHumanModel(1.8, carpetZ + 3.8));  

            // 4. 栏杆
            if (railH > 0) {
                const railing = new THREE.Mesh(
                    new THREE.BoxGeometry(W - 0.2, railH, 0.08),
                    new THREE.MeshStandardMaterial({ color: 0x94a3b8, transparent: true, opacity: 0.85 })
                );
                railing.position.set(0, railH / 2, railZ);
                roomGroup.add(railing);
            }

            // 5. 相机与目标点
            const camPos = new THREE.Vector3(0, camH, camZ);
            const targetPos = new THREE.Vector3(0, 0, targetZ);
            
            const targetDot = new THREE.Mesh(
                new THREE.SphereGeometry(0.08, 16, 16),
                new THREE.MeshBasicMaterial({ color: 0x06b6d4 })
            );
            targetDot.position.copy(targetPos);
            roomGroup.add(targetDot);

            const cameraModel = createCameraModel();
            cameraModel.position.copy(camPos);
            cameraModel.lookAt(targetPos);
            roomGroup.add(cameraModel);

            // 6. 光学四棱锥生成
            const hFovRad = hfov * (Math.PI / 180);
            const vFovRad = 2 * Math.atan(Math.tan(hFovRad / 2) * (9 / 16));
            const vFovDeg = vFovRad * (180 / Math.PI);
            
            const virtualCam = new THREE.PerspectiveCamera(vFovDeg, 16/9, 0.1, farDist);
            virtualCam.position.copy(camPos);
            virtualCam.lookAt(targetPos);
            virtualCam.updateMatrixWorld();
            virtualCam.updateProjectionMatrix();

            const ndcCorners = [[-1, -1], [1, -1], [1, 1], [-1, 1]];
            const frustumCorners = [];
            
            ndcCorners.forEach(ndc => {
                const pt = new THREE.Vector3(ndc[0], ndc[1], 1.0);
                pt.unproject(virtualCam);
                frustumCorners.push(pt);
            });

            // 7. 发光边界线
            const edgeLinesGeo = new THREE.BufferGeometry();
            const c0 = frustumCorners[0], c1 = frustumCorners[1], c2 = frustumCorners[2], c3 = frustumCorners[3];
            
            const linePoints = [
                camPos, c0, c1, camPos, 
                camPos, c2, c3, camPos, 
                c0, c3, c1, c2          
            ];
            
            edgeLinesGeo.setFromPoints(linePoints);
            const edgeMat = new THREE.LineBasicMaterial({ 
                color: 0x22d3ee, 
                transparent: true, 
                opacity: 1.0, 
                blending: THREE.AdditiveBlending 
            });
            roomGroup.add(new THREE.Line(edgeLinesGeo, edgeMat));

            // 8. 半透明光锥体积
            const frustumVolumeGeo = new THREE.BufferGeometry();
            const vertices = new Float32Array([
                camPos.x, camPos.y, camPos.z,  c0.x, c0.y, c0.z,  c1.x, c1.y, c1.z,
                camPos.x, camPos.y, camPos.z,  c1.x, c1.y, c1.z,  c2.x, c2.y, c2.z,
                camPos.x, camPos.y, camPos.z,  c2.x, c2.y, c2.z,  c3.x, c3.y, c3.z,
                camPos.x, camPos.y, camPos.z,  c3.x, c3.y, c3.z,  c0.x, c0.y, c0.z,
                c0.x, c0.y, c0.z,  c2.x, c2.y, c2.z,  c1.x, c1.y, c1.z,
                c1.x, c1.y, c1.z,  c2.x, c2.y, c2.z,  c3.x, c3.y, c3.z
            ]);
            frustumVolumeGeo.setAttribute('position', new THREE.BufferAttribute(vertices, 3));
            
            const volumeMat = new THREE.MeshBasicMaterial({ 
                color: 0x0284c7, 
                transparent: true, 
                opacity: 0.2, 
                blending: THREE.AdditiveBlending, 
                depthWrite: false, 
                side: THREE.DoubleSide
            });
            roomGroup.add(new THREE.Mesh(frustumVolumeGeo, volumeMat));
        }

        const updateParam = (id, paramKey, isFloat = true) => {
            document.getElementById(`range-${id}`).addEventListener('input', (e) => {
                const val = isFloat ? parseFloat(e.target.value) : parseInt(e.target.value);
                // 针对不同步长的滑块保留合理的小数位
                const decimalPlaces = e.target.step && e.target.step.includes('0.05') ? 2 : (isFloat ? 1 : 0);
                document.getElementById(`val-${id}`).innerText = val.toFixed(decimalPlaces);
                params[paramKey] = val;
                updateScene();
            });
        };

        updateParam('depth', 'depth');
        updateParam('width', 'width');
        updateParam('height', 'height');
        updateParam('camz', 'camZ');
        updateParam('camh', 'camH');
        updateParam('targetZ', 'targetZ');
        updateParam('hfov', 'hfov', false);
        updateParam('fardist', 'farDist');
        updateParam('railh', 'railH');
        updateParam('railz', 'railZ');
        updateParam('carpetz', 'carpetZ');

        updateScene();

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, mainCamera);
        }
        animate();

        window.addEventListener('resize', () => {
            mainCamera.aspect = window.innerWidth / window.innerHeight;
            mainCamera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
